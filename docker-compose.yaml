services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local_root_password_change_me}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-learning_index}
      MYSQL_USER: ${MYSQL_USER:-learning_index_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-local_app_password_change_me}
    ports:
      - "3306:3306"
    volumes:
      # Persist the local database when containers are stopped or recreated.
      - mysql_data:/var/lib/mysql
    healthcheck:
      # Backend starts only after MySQL accepts authenticated connections.
      test:
        - CMD-SHELL
        - MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --host=127.0.0.1 --user="$${MYSQL_USER}" "$${MYSQL_DATABASE}" --execute='SELECT 1'
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  backend:
    build:
      context: ./backend
      dockerfile: dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Inside Compose, `db` is the database host; localhost would mean this container.
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-learning_index_user}:${MYSQL_PASSWORD:-local_app_password_change_me}@db:3306/${MYSQL_DATABASE:-learning_index}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      # Healthcheck verifies both FastAPI and MySQL database connectivity.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    image: nginx:1.27-alpine
    restart: unless-stopped
    # Serve the existing static frontend without adding a separate build toolchain.
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  mysql_data:

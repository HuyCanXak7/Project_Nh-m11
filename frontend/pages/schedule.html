        <nav class="sidebar__nav" aria-label="Điều hướng chính">

            <a href="statistics.html" class="nav-item">

            <a href="semesters.html" class="nav-item">

            <a href="courses.html" class="nav-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 4h8v16H3zM11 4h10v16H11z"/></svg>
                Môn học
            </a>
            <a href="schedule.html" class="nav-item is-active" aria-current="page">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
                Thời khóa biểu

            <a href="goals.html" class="nav-item">

                Bảng điểm
            </a>
            <a href="import.html" class="nav-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                Nhập CSV
            </a>
            <a href="profile.html" class="nav-item">

                Cài đặt
            </a>
        </nav>

        <div class="motivation">
            <svg class="motivation__cup" viewBox="0 0 28 44" aria-hidden="true">
                <defs>
                    <linearGradient id="cupGold" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0" stop-color="#FFD966"/><stop offset="1" stop-color="#F5A623"/>
                    </linearGradient>
                </defs>
                <path d="M1 1h26v12q0 14-13 16Q1 27 1 13Z" fill="url(#cupGold)"/>
                <rect x="10" y="29" width="8" height="8" fill="#F5A623"/>
                <rect x="4" y="37" width="20" height="6" rx="2" fill="#E2961C"/>
            </svg>
            <p class="motivation__text">Cố gắng hơn mỗi ngày!</p>
            <svg class="motivation__line" viewBox="0 0 80 12" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true">
                <path d="M3 9q35-10 74-6"/>
            </svg>
        </div>
    </aside>
    <div class="sidebar-overlay" id="sidebarOverlay" hidden></div>

    <!-- ===== Main ===== -->
    <main class="dash">
        <header class="dash-header">
            <button type="button" class="dash-header__menu" id="menuToggle" aria-label="Mở menu" aria-controls="sidebar" aria-expanded="false">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
            </button>

            <div class="dash-header__greeting">
                <h1 class="dash-header__title">
                    <span>Thời khóa biểu</span>
                    <span class="dash-header__slash">/</span>
                    <span class="dash-header__sub-inline">Lịch học tuần theo học kỳ</span>
                </h1>
            </div>

            <div class="dash-header__actions">
                <button type="button" onclick="handleResetData()" class="btn-reset" title="Nạp dữ liệu mẫu">
                     Dữ liệu mẫu
                </button>
                <button type="button" class="icon-btn" aria-label="Thông báo" title="Thông báo">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M6 17V11a6 6 0 0 1 12 0v6l2 2H4Z"/><path d="M10 21a2.5 2.5 0 0 0 4 0"/></svg>
                    <span class="icon-btn__dot"></span>
                </button>
                <!-- Menu tài khoản -->
                <div class="user-menu" id="userMenu">
                    <button type="button" class="user-chip" id="userMenuToggle" aria-haspopup="menu" aria-expanded="false" aria-controls="userMenuList">
                        <span class="user-chip__avatar" id="userAvatar">SV</span>
                        <span class="user-chip__name" id="userChipName">Sinh viên</span>
                        <svg class="user-chip__caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>
                    </button>

                    <ul class="user-menu__list" id="userMenuList" role="menu" hidden>
                        <li role="none">
                            <a href="profile.html" class="user-menu__item" role="menuitem">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
                                Xem thông tin
                            </a>
                        </li>
                        <li role="none">
                            <button type="button" class="user-menu__item user-menu__item--danger" id="logoutBtn" role="menuitem">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
                                Đăng xuất
                            </button>
                        </li>
                    </ul>
                </div>
            </div>
        </header>

        <!-- MAIN CARD -->
        <div class="app-card" style="margin-top: 0; box-shadow: var(--shadow-soft); border-radius: var(--radius-lg);">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px;">
                <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
                    <span style="font-size: 14.5px; font-weight: 700; color: var(--text-black);">Học kỳ hiển thị:</span>
                    <select id="scheduleSemSelect" class="filter-select" onchange="renderScheduleBoard()" aria-label="Chọn học kỳ xem thời khóa biểu"></select>
                </div>
                <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                    <a href="courses.html" class="btn btn-primary btn-sm" style="text-decoration: none;">+ Quản lý môn học</a>
                </div>
            </div>

            <!-- LƯỚI THỜI KHÓA BIỂU CÁC NGÀY TRONG TUẦN -->
            <div id="scheduleBoardContainer"></div>
        </div>
    </main>

    <!-- SCRIPTS -->
    <script src="../assets/js/storageService.js"></script>
    <script src="../assets/js/gradeCalculator.js"></script>
    <script src="../assets/js/session.js"></script>
    <script src="../assets/js/app_shell.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            initSchedulePage();
        });

        async function initSchedulePage() {
            const container = document.getElementById('scheduleBoardContainer');
            const semSelect = document.getElementById('scheduleSemSelect');
            if (!container) return;

            container.innerHTML = '<div class="empty-state"><p class="empty-state__desc">Đang tải thời khóa biểu...</p></div>';

            try {
                await StorageService.ready;
                const semesters = StorageService.getSemesters();
                if (semSelect) {
                    semSelect.innerHTML = '<option value="ALL">Tất cả học kỳ</option>' +
                        semesters.map(s => `<option value="${escapeHtml(s.id)}">${escapeHtml(s.name)} (${escapeHtml(s.academic_year || '')})</option>`).join('');
                    if (semesters.length > 0) {
                        semSelect.value = semesters[semesters.length - 1].id;
                    }
                }
                renderScheduleBoard();
            } catch (err) {
                console.error('Lỗi tải thời khóa biểu:', err);
                container.innerHTML = `
                    <div class="empty-state" style="border-color: rgba(239, 68, 68, 0.45); background: #FEF2F2;">
                        <h3 class="empty-state__title" style="color: #991B1B;">Không thể tải thời khóa biểu</h3>
                        <p class="empty-state__desc">Đã xảy ra lỗi khi tải dữ liệu từ máy chủ. Vui lòng thử tải lại.</p>
                        <button type="button" onclick="initSchedulePage()" class="btn btn-primary btn-sm">Thử tải lại</button>
                    </div>
                `;
            }
        }

        function renderScheduleBoard() {
            const container = document.getElementById('scheduleBoardContainer');
            const semSelect = document.getElementById('scheduleSemSelect');
            if (!container) return;

            const allCourses = StorageService.getCourses();
            const semesters = StorageService.getSemesters();
            const selectedSem = semSelect?.value || 'ALL';

            const courses = selectedSem === 'ALL'
                ? allCourses
                : allCourses.filter(c => c.semester_id === selectedSem);

            if (courses.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state__icon">
                            <svg viewBox="0 0 24 24" width="44" height="44" fill="none" stroke="var(--primary)" stroke-width="1.8" stroke-linecap="round" style="margin: 0 auto;">
                                <rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>
                            </svg>
                        </div>
                        <h3 class="empty-state__title">Chưa có lịch học trong kỳ này</h3>
                        <p class="empty-state__desc">Tài khoản của bạn chưa có môn học nào được đăng ký cho học kỳ đã chọn. Hãy thêm môn học hoặc nạp dữ liệu mẫu để xem thời khóa biểu tuần học.</p>
                        <div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">
                            <a href="courses.html" class="btn btn-primary btn-sm" style="text-decoration: none;">+ Thêm môn học</a>
                            <button type="button" onclick="handleResetData()" class="btn btn-secondary btn-sm">Nạp dữ liệu mẫu</button>
                        </div>
                    </div>
                `;
                return;
            }

            const days = [
                { name: 'Thứ Hai', items: [] },
                { name: 'Thứ Ba', items: [] },
                { name: 'Thứ Tư', items: [] },
                { name: 'Thứ Năm', items: [] },
                { name: 'Thứ Sáu', items: [] },
                { name: 'Thứ Bảy', items: [] }
            ];
            const slots = ['07:30 - 09:30', '09:45 - 11:45', '13:30 - 15:30', '15:45 - 17:45'];
            const colors = ['#3B82F6', '#10B981', '#8B5CF6', '#F59E0B', '#06B6D4'];
            const rooms = ['B2-301', 'Lab 402', 'C1-105', 'A3-204', 'Lab 201'];

            courses.forEach((c, idx) => {
                const dayIdx = idx % 5;
                const sem = semesters.find(s => s.id === c.semester_id);
                days[dayIdx].items.push({
                    code: c.course_code,
                    name: c.course_name,
                    credits: c.credits,
                    semName: sem ? sem.name : '',
                    slot: slots[idx % slots.length],
                    color: colors[idx % colors.length],
                    room: rooms[idx % rooms.length]
                });
            });

            container.innerHTML = `
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 210px), 1fr)); gap: 14px;">
                    ${days.map(d => `
                        <div style="background: var(--bg-main); border-radius: 18px; padding: 16px;">
                            <div style="font-weight: 800; font-size: 14.5px; color: var(--text-black); margin-bottom: 12px; border-bottom: 2px solid var(--border); padding-bottom: 6px;">
                                ${d.name}
                            </div>
                            <div style="display: flex; flex-direction: column; gap: 10px;">
                                ${d.items.length === 0 ? `
                                    <div style="text-align: center; color: var(--text-gray); font-size: 12.5px; padding: 24px 0;">
                                        Không có lịch học
                                    </div>
                                ` : d.items.map(it => `
                                    <div style="background: var(--e-card); border-left: 4px solid ${it.color}; border-radius: 12px; padding: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.04);">
                                        <div style="font-size: 11px; font-weight: 700; color: ${it.color};">${escapeHtml(it.slot)}</div>
                                        <div style="font-size: 13.5px; font-weight: 700; color: var(--text-black); margin: 3px 0;">${escapeHtml(it.name)}</div>
                                        <div style="font-size: 11.5px; color: var(--text-gray);">Mã: ${escapeHtml(it.code)} (${escapeHtml(it.credits)} TC) • Phòng: ${escapeHtml(it.room)}</div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên mật khẩu - Quản lí chỉ số học tập</title>
    <link rel="stylesheet" href="../assets/css/variables.css">
    <link rel="stylesheet" href="../assets/css/common.css">
    <link rel="stylesheet" href="../assets/css/auth.css">
    <link rel="stylesheet" href="../assets/css/model.css">
</head>
<body class="page-login">
    <div class="bg-decoration" aria-hidden="true">
        <div class="bg-circle bg-circle--1"></div>
        <div class="bg-circle bg-circle--2"></div>
        <div class="bg-circle bg-circle--3"></div>
    </div>

    <main class="auth-container">
        <!-- Forgot Password Card -->
        <section class="auth-card auth-card--login">
            <a href="index.html" class="auth-card__tab">← Đăng Nhập</a>

            <form class="auth-form auth-form--login" id="forgotForm" onsubmit="event.preventDefault(); document.getElementById('sentAlert').style.display='block'; document.getElementById('btnSubmit').disabled=true;" novalidate>
                <div style="margin-bottom: 20px;">
                    <h2 style="font-size: 24px; font-weight: 800; color: var(--text-black); margin-bottom: 6px;">Quên mật khẩu?</h2>
                    <p style="font-size: 13.5px; color: var(--text-gray); line-height: 1.5;">
                        Nhập địa chỉ email trường học của bạn. Chúng tôi sẽ gửi hướng dẫn khôi phục mật khẩu tài khoản.
                    </p>
                </div>

                <div id="sentAlert" style="display: none; background: #DFF4EA; border: 1.5px solid #16A34A; border-radius: 16px; padding: 14px; margin-bottom: 18px; color: #166534; font-size: 13.5px; font-weight: 600;">
                    Đã gửi liên kết khôi phục mật khẩu đến email của bạn! Vui lòng kiểm tra hộp thư đến hoặc mục Spam.
                </div>

                <label class="auth-form__label" for="forgotEmail">Địa chỉ Email</label>
                <div class="input-wrapper">
                    <div class="input-group">
                        <svg class="input-group__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="2.5" y="4.5" width="19" height="15" rx="2.5"/>
                            <path d="M3 6.5l9 6.5 9-6.5"/>
                        </svg>
                        <input type="email" class="input-group__input" placeholder="nguyenvana@gmail.com" id="forgotEmail" autocomplete="email" required>
                    </div>
                </div>

                <button type="submit" id="btnSubmit" class="auth-form__submit" style="margin-top: 10px;">
                    Gửi yêu cầu
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 12h18M14 5l7 7-7 7"/>
                    </svg>
                </button>

                <div style="text-align: center; margin-top: 20px; font-size: 13.5px;">
                    Nhớ mật khẩu rồi? <a href="index.html" style="color: var(--primary); font-weight: 700; text-decoration: none;">Đăng nhập ngay</a>
                </div>
            </form>
        </section>

        <!-- Right side text -->
        <aside class="auth-side auth-side--login">
            <h1 class="auth-side__title">
                StudyTrack <span>Học tập</span>
            </h1>
            <p class="auth-side__subtitle">
                An toàn & Tiện lợi
                <svg class="auth-side__scribble" viewBox="0 0 110 40" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                    <path d="M4 34C30 22 70 12 106 8"/>
                    <path d="M14 34C42 24 76 16 100 14"/>
                </svg>
            </p>
        </aside>
    </main>
</body>
</html>

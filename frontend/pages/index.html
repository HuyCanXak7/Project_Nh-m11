<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Quản lí chỉ số học tập</title>
    <link rel="stylesheet" href="../assets/css/variables.css">
    <link rel="stylesheet" href="../assets/css/common.css">
    <link rel="stylesheet" href="../assets/css/auth.css">
    <link rel="stylesheet" href="../assets/css/model.css">
</head>
<body class="page-login">
    <div class="bg-decoration" aria-hidden="true">
        <div class="bg-circle bg-circle--1"></div>
        <div class="bg-circle bg-circle--2"></div>
        <div class="bg-circle bg-circle--3"></div>
    </div>

    <main class="auth-container">
        <!-- Login Card -->
        <section class="auth-card auth-card--login">
            <a href="register.html" class="auth-card__tab">Đăng Ký</a>

            <form class="auth-form auth-form--login" id="loginForm" novalidate>
                <label class="auth-form__label" for="loginEmail">Tài khoản</label>
                <div class="input-wrapper">
                    <div class="input-group">
                        <svg class="input-group__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="2.5" y="4.5" width="19" height="15" rx="2.5"/>
                            <path d="M3 6.5l9 6.5 9-6.5"/>
                        </svg>
                        <input type="email" class="input-group__input" placeholder="nguyenvana@gmail.com" id="loginEmail" autocomplete="email" required>
                    </div>
                    <span class="input-error" id="loginEmailError"></span>
                </div>

                <label class="auth-form__label" for="loginPassword">Mật khẩu</label>
                <div class="input-wrapper">
                    <div class="input-group">
                        <!-- Key icon -->
                        <svg class="input-group__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="15.5" cy="8.5" r="5.5"/>
                            <circle cx="16.5" cy="7.5" r="1.2"/>
                            <path d="M11.6 12.4L3.5 20.5v-3h2.5V15h2.5l1.8-1.8"/>
                        </svg>
                        <input type="password" class="input-group__input" placeholder="•••••••" id="loginPassword" autocomplete="current-password" required>
                        <button type="button" class="input-group__toggle" data-toggle-password="loginPassword" aria-label="Hiện/ẩn mật khẩu">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                                <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                                <line x1="1" y1="1" x2="23" y2="23"/>
                            </svg>
                        </button>
                    </div>
                    <span class="input-error" id="loginPasswordError"></span>
                </div>

                <div class="auth-form__options">
                    <label class="auth-form__remember">
                        Nhớ tài khoản
                        <input type="checkbox" id="rememberMe">
                    </label>
                    <a href="forgot-password.html" class="auth-form__forgot">Bạn quên mật khẩu?</a>
                </div>

                <button type="submit" class="auth-form__submit">
                    Đăng nhập
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 12h18M14 5l7 7-7 7"/>
                    </svg>
                </button>
            </form>
        </section>

        <!-- Right side text -->
        <aside class="auth-side auth-side--login">
            <h1 class="auth-side__title">
                Hôm nay <span>thế nào?</span>
            </h1>
            <p class="auth-side__subtitle">
                Học tập gì chưa
                <svg class="auth-side__scribble" viewBox="0 0 110 40" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                    <path d="M4 34C30 22 70 12 106 8"/>
                    <path d="M14 34C42 24 76 16 100 14"/>
                </svg>
            </p>
        </aside>
    </main>

    <script src="../assets/js/auth_common.js"></script>
    <script src="../assets/js/session.js"></script>
    <script>redirectIfLoggedIn();</script>
    <script src="../assets/js/pages/login.js"></script>
</body>
</html>

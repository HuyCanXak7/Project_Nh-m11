    <rect x="750" y="315" width="65" height="29" rx="14.5" fill="#2563EB"/>
    <text x="782.5" y="334" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">Kỳ này</text>
    <rect x="825" y="315" width="75" height="29" rx="14.5" fill="#F1F4F9"/>
    <text x="862.5" y="334" text-anchor="middle" font-size="13" fill="#5B6475">Kỳ trước</text>
    <rect x="910" y="315" width="64" height="29" rx="14.5" fill="#F1F4F9"/>
    <text x="942" y="334" text-anchor="middle" font-size="13" fill="#5B6475">Tất cả</text>
    <!-- Grid -->
    <g stroke="#E8ECF3" stroke-width="1">
      <path d="M323 367 V535 M478 367 V535 M633 367 V535 M787 367 V535 M942 367 V535"/>
      <path d="M318 535 H960" stroke="#D5DBE6"/>
    </g>
    <g font-size="12.5" fill="#5B6475" text-anchor="end">
      <text x="290" y="371">10</text><text x="290" y="404">8</text><text x="290" y="438">6</text>
      <text x="290" y="472">4</text><text x="290" y="505">2</text><text x="290" y="539">0</text>
    </g>
    <g font-size="12.5" fill="#5B6475" text-anchor="middle">
      <text x="323" y="558">Tuần 1</text><text x="478" y="558">Tuần 2</text><text x="633" y="558">Tuần 3</text>
      <text x="787" y="558">Tuần 4</text><text x="942" y="558">Tuần 5</text>
    </g>

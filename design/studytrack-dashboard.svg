    <path d="M1240 572 Q1330 520 1409 540 V554 Q1409 572 1391 572 Z" fill="#fff" opacity="0.12"/>
    <text x="1035" y="397" font-size="24" font-weight="800" fill="#fff">Bạn làm rất tốt!</text>
    <text x="1035" y="430" font-size="16" fill="#fff" opacity="0.92">Hãy tiếp tục cố gắng</text>
    <text x="1035" y="454" font-size="16" fill="#fff" opacity="0.92">để đạt được mục tiêu nhé!</text>
    <rect x="1035" y="498" width="190" height="48" rx="24" fill="#fff"/>
    <text x="1130" y="528" text-anchor="middle" font-size="15" font-weight="600" fill="#1A2233">Đặt mục tiêu mới →</text>
    <!-- Trophy -->
    <g id="Trophy">
      <path d="M1262 352 Q1238 352 1240 378 Q1243 400 1272 406" fill="none" stroke="#F5B731" stroke-width="9"/>
      <path d="M1360 352 Q1384 352 1382 378 Q1379 400 1350 406" fill="none" stroke="#F5B731" stroke-width="9"/>
      <path d="M1258 338 H1364 V368 Q1364 420 1311 428 Q1258 420 1258 368 Z" fill="url(#gold)"/>
      <path d="M1311 360 L1317 374 L1332 375 L1320 384 L1324 399 L1311 391 L1298 399 L1302 384 L1290 375 L1305 374 Z" fill="#FFF3C4"/>
      <rect x="1302" y="428" width="18" height="20" fill="#E8A21E"/>
      <rect x="1284" y="448" width="54" height="20" rx="4" fill="#F5B731"/>
      <rect x="1274" y="466" width="74" height="14" rx="4" fill="#3B4A6B"/>
    </g>
    <g fill="#FFE27A">
      <path d="M1245 330 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3 Z"/>
      <path d="M1250 420 l2 6 6 2 -6 2 -2 6 -2 -6 -6 -2 6 -2 Z"/>
      <path d="M1360 446 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3 Z"/>
    </g>
  </g>

  <!-- Recent activity -->
  <g id="Activity Card">
    <rect x="250" y="600" width="556" height="180" rx="18" fill="#fff" filter="url(#shadow)"/>
    <circle cx="281" cy="630" r="9" fill="none" stroke="#1A2233" stroke-width="1.8"/>
    <path d="M281 625 V630 L285 633" stroke="#1A2233" stroke-width="1.8" fill="none"/>
    <text x="302" y="636" font-size="19" font-weight="700" fill="#1A2233">Hoạt động gần đây</text>
    <text x="786" y="636" text-anchor="end" font-size="15" fill="#2563EB">Xem tất cả →</text>

    <circle cx="287" cy="671" r="12" fill="#DFF4EA"/>
    <path d="M281 671 L285 675 L293 667" stroke="#16A34A" stroke-width="2.2" fill="none"/>
    <text x="322" y="676" font-size="15" fill="#1F2937">Bạn đã cập nhật điểm môn Toán</text>
    <text x="786" y="676" text-anchor="end" font-size="13" fill="#7A8396">2 giờ trước</text>

    <circle cx="287" cy="711" r="12" fill="#E3EDFD"/>
    <rect x="281" y="705" width="12" height="12" rx="2" fill="none" stroke="#2563EB" stroke-width="1.8"/>
    <text x="322" y="716" font-size="15" fill="#1F2937">Thêm lịch học: Cơ sở dữ liệu</text>
    <text x="786" y="716" text-anchor="end" font-size="13" fill="#7A8396">1 ngày trước</text>

    <circle cx="287" cy="751" r="12" fill="#ECE7FD"/>
    <circle cx="287" cy="751" r="6" fill="none" stroke="#7C4DEB" stroke-width="2"/>
    <circle cx="287" cy="751" r="2" fill="#7C4DEB"/>
    <text x="322" y="756" font-size="15" fill="#1F2937">Cập nhật mục tiêu: Đạt GPA 3.5</text>
    <text x="786" y="756" text-anchor="end" font-size="13" fill="#7A8396">2 ngày trước</text>
  </g>

  <!-- Upcoming schedule -->
  <g id="Schedule Card">
    <rect x="822" y="600" width="587" height="180" rx="18" fill="#fff" filter="url(#shadow)"/>
    <path d="M1250 780 Q1290 700 1409 690 V762 Q1409 780 1391 780 Z" fill="#EAF1FD"/>
    <rect x="840" y="621" width="18" height="17" rx="3" fill="none" stroke="#1A2233" stroke-width="1.8"/>
    <path d="M840 627 H858 M845 618 V623 M853 618 V623" stroke="#1A2233" stroke-width="1.8"/>
    <text x="872" y="636" font-size="19" font-weight="700" fill="#1A2233">Lịch học sắp tới</text>
    <text x="1389" y="636" text-anchor="end" font-size="15" fill="#2563EB">Xem tất cả →</text>

    <rect x="840" y="657" width="60" height="50" rx="8" fill="#F3F6FB"/>
    <text x="870" y="678" text-anchor="middle" font-size="14" fill="#1A2233">Th 3</text>
    <text x="870" y="698" text-anchor="middle" font-size="14" fill="#1A2233">11/11</text>
    <rect x="920" y="662" width="3" height="40" rx="1.5" fill="#7FA9F7"/>
    <text x="936" y="677" font-size="15" fill="#1A2233">Lập trình iOS</text>
    <text x="936" y="698" font-size="13.5" fill="#5B6475">08:00 - 10:00</text>

    <rect x="840" y="719" width="60" height="50" rx="8" fill="#F3F6FB"/>
    <text x="870" y="740" text-anchor="middle" font-size="14" fill="#1A2233">Th 4</text>
    <text x="870" y="760" text-anchor="middle" font-size="14" fill="#1A2233">12/11</text>
    <rect x="920" y="724" width="3" height="40" rx="1.5" fill="#A989F2"/>
    <text x="936" y="739" font-size="15" fill="#1A2233">Cơ sở dữ liệu</text>
    <text x="936" y="760" font-size="13.5" fill="#5B6475">13:30 - 15:30</text>

    <!-- Books -->
    <g id="Books">
      <path d="M1262 742 L1330 730 L1372 744 L1304 758 Z" fill="#6D8FF0"/>
      <path d="M1262 742 V756 L1304 772 V758 Z" fill="#4C6FE0"/>
      <path d="M1304 758 L1372 744 V758 L1304 772 Z" fill="#EEF2FF"/>
      <path d="M1268 720 L1336 708 L1378 722 L1310 736 Z" fill="#3E63DD"/>
      <path d="M1268 720 V734 L1310 750 V736 Z" fill="#2C4FC5"/>
      <path d="M1310 736 L1378 722 V736 L1310 750 Z" fill="#F7F9FF"/>

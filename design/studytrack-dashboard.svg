    <path d="M323 468 C380 450 420 442 478 438 C540 432 580 428 633 426 C690 422 735 416 787 412 C850 406 900 402 942 399 V535 H323 Z" fill="url(#area)"/>
    <path d="M323 468 C380 450 420 442 478 438 C540 432 580 428 633 426 C690 422 735 416 787 412 C850 406 900 402 942 399" fill="none" stroke="#2563EB" stroke-width="2.5"/>
    <g fill="#2563EB" stroke="#fff" stroke-width="2">
      <circle cx="323" cy="468" r="5.5"/><circle cx="478" cy="438" r="5.5"/><circle cx="633" cy="426" r="5.5"/>
      <circle cx="787" cy="412" r="5.5"/><circle cx="942" cy="399" r="6.5"/>
    </g>
    <!-- Tooltip -->
    <rect x="922" y="359" width="40" height="25" rx="7" fill="#2563EB"/>
    <path d="M937 384 L942 390 L947 384 Z" fill="#2563EB"/>
    <text x="942" y="376" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">8.3</text>
  </g>

  <!-- Banner -->
